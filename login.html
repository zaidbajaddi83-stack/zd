<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171512">
  <title>DILEONASTREET | Login & Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --gold: #d4af37;
      --gold-dark: #a98216;
      --ink: #22211e;
      --muted: #85837e;
      --line: #e8e6e1;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px;
      display: grid;
      place-items: center;
      color: var(--ink);
      font-family: 'Poppins', sans-serif;
      background: #171512 url('Background.png') center/cover fixed no-repeat;
    }
    .auth-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(360px, 460px) minmax(0, 1fr);
      width: min(1190px, 100%);
      min-height: min(740px, calc(100vh - 56px));
      overflow: hidden;
      border-radius: 28px;
      background: var(--white);
      box-shadow: 0 30px 80px #0005;
      animation: appear .65s ease both;
    }
    .form-panel {
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 52px;
      background: #fff;
    }
    .form-box { width: 100%; max-width: 340px; }
    h1 { margin: 0; font-size: clamp(28px, 3vw, 35px); font-weight: 700; letter-spacing: -.8px; }
    .intro { margin: 8px 0 27px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .auth-form { display: grid; gap: 16px; }
    .field { position: relative; }
    .field label { display: block; margin-bottom: 6px; color: #55534e; font-size: 12px; font-weight: 500; }
    .field input {
      width: 100%; height: 48px; padding: 0 14px;
      border: 1px solid var(--line); border-radius: 10px;
      outline: 0; background: #fff; color: var(--ink);
      font: inherit; font-size: 13px; transition: border-color .2s, box-shadow .2s;
    }
    .field input::placeholder { color: #aaa8a2; }
    .field input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px #d4af371c; }
    .password-wrap input { padding-right: 46px; }
    .password-toggle {
      position: absolute; right: 13px; bottom: 13px; padding: 0;
      border: 0; background: transparent; color: #777; cursor: pointer; font-size: 17px;
    }
    .form-options { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: -2px 0 1px; font-size: 11px; }
    .remember { display: inline-flex; align-items: center; gap: 7px; color: #66645f; }
    .remember input { accent-color: var(--gold-dark); }
    .text-link { color: var(--gold-dark); text-decoration: none; font-weight: 600; }
    .text-link:hover { text-decoration: underline; }
    .submit-btn {
      min-height: 50px; margin-top: 2px; border: 0; border-radius: 999px;
      color: #fff; background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      box-shadow: 0 8px 20px #a982162b; cursor: pointer; font: inherit; font-size: 14px; font-weight: 600;
      transition: transform .2s, box-shadow .2s;
    }
    .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px #a9821640; }
    .switch-copy { margin: 18px 0 0; text-align: center; color: #77746e; font-size: 12px; }
    .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0 15px; color: #92908b; font-size: 11px; white-space: nowrap; }
    .divider::before, .divider::after { content: ''; height: 1px; flex: 1; background: var(--line); }
    .social { display: flex; justify-content: center; gap: 13px; }
    .social a {
      width: 43px; height: 43px; display: grid; place-items: center;
      border: 1px solid var(--line); border-radius: 50%; color: #393833;
      background: #fff; text-decoration: none; font-size: 17px;
      box-shadow: 0 4px 12px #0000000a; transition: .2s;
    }
    .social a:hover { transform: translateY(-3px); color: #fff; border-color: var(--gold-dark); background: var(--gold-dark); }
    .social a[aria-label="Scan QR code"] { color: var(--gold-dark); }
    .social a[aria-label="Scan QR code"]:hover { color: #fff; }
    .visual-panel {
      position: relative; min-height: 520px; overflow: hidden;
      background: #332719 url('Background Dileonastreet.png') center/cover no-repeat;
    }
    .visual-panel::before {
      content: ''; position: absolute; inset: 0;
      background: rgba(0, 0, 0, .08);
    }
    .flash-message { min-height: 18px; margin: 10px 0 0; text-align: center; color: #6a581e; font-size: 11px; }
    [hidden] { display: none !important; }
    @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 800px) {
      body { padding: 18px; }
      .auth-card { grid-template-columns: minmax(0, 1fr); width: min(480px, 100%); min-height: 0; }
      .visual-panel {
        display: block;
        order: -1;
        width: 100%;
        min-height: clamp(160px, 44vw, 225px);
      }
      .form-panel { padding: 38px 32px; }
    }
    @media (max-width: 390px) {
      body { padding: 10px; }
      .form-panel { padding: 30px 22px; }
      .auth-card { border-radius: 20px; }
      .form-options { font-size: 10px; }
    }


    /* Mobile-first refinements: keep the form readable and scrollable. */
    @media (max-width: 800px) {
      body {
        height: 100vh;
        height: 100svh;
        height: 100dvh;
        min-height: 0;
        overflow: hidden;
        padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
        place-items: center;
      }
      .auth-card {
        width: min(480px, 100%);
        height: 100%;
        max-height: 100%;
        min-height: 0;
        grid-template-columns: minmax(0, 1fr);
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior-y: contain;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .auth-card::-webkit-scrollbar { display: none; }
      .visual-panel {
        display: block;
        order: -1;
        width: 100%;
        min-height: clamp(160px, 44vw, 225px);
      }
      .form-panel { min-width: 0; padding: clamp(28px, 7vw, 42px) clamp(20px, 7vw, 34px); }
      .form-box { min-width: 0; }
    }

    @media (max-width: 480px) {
      body { padding-left: 12px; padding-right: 12px; }
      .auth-card { border-radius: 22px; }
      .form-panel { padding: 28px clamp(18px, 6vw, 26px); }
      h1 { font-size: clamp(26px, 8vw, 32px); }
      .intro { margin: 7px 0 22px; font-size: 12px; }
      .auth-form { gap: 14px; }
      .field input { height: 50px; font-size: 16px; }
      .form-options { flex-wrap: wrap; row-gap: 10px; font-size: 11px; }
      .submit-btn { width: 100%; min-height: 50px; }
      .divider { margin-top: 20px; }
      .social { flex-wrap: wrap; }
    }

    @media (max-width: 350px) {
      body { padding-left: 9px; padding-right: 9px; }
      .form-panel { padding-left: 17px; padding-right: 17px; }
      .form-options { align-items: flex-start; }
    }

    @media (max-width: 800px) and (max-height: 650px) {
      body { place-items: start center; }
      .form-panel { padding-top: 22px; padding-bottom: 22px; }
      .intro { margin-bottom: 16px; }
      .auth-form { gap: 11px; }
      .divider { margin-top: 14px; margin-bottom: 10px; }
      .switch-copy { margin-top: 12px; }
    }

  </style>
</head>
<body>
  <main class="auth-card">
    <section class="form-panel" aria-label="Account access">
      <div class="form-box">
        <h1 id="form-title">WELCOME BACK</h1>
        <p class="intro" id="form-intro">Sign in to your account to continue.</p>

        <form class="auth-form" id="auth-form">
          <div class="field" id="name-field" hidden>
            <label for="full-name">Full name</label>
            <input id="full-name" name="name" type="text" placeholder="Your full name" autocomplete="name">
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
          </div>
          <div class="field password-wrap">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" minlength="6" autocomplete="current-password" required>
            <button class="password-toggle" type="button" aria-label="Show password" title="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
          </div>
          <div class="field password-wrap" id="confirm-field" hidden>
            <label for="confirm-password">Confirm password</label>
            <input id="confirm-password" name="confirmPassword" type="password" placeholder="Re-enter your password" minlength="6" autocomplete="new-password">
            <button class="password-toggle" type="button" aria-label="Show password" title="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
          </div>
          <div class="form-options" id="login-options">
            <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
            <a href="#forgot-password" class="text-link" id="forgot-link">Forgot password?</a>
          </div>
          <button class="submit-btn" id="submit-btn" type="submit">Access Account</button>
        </form>

        <p class="switch-copy"><span id="switch-prompt">Don't have an account?</span> <a href="#signup" class="text-link" id="switch-link">Sign up</a></p>
        <p class="flash-message" id="flash-message" role="status" aria-live="polite"></p>

        <div class="divider"><span>Or continue with</span></div>
        <nav class="social" aria-label="Social links">
          <a href="mailto:" aria-label="Gmail" title="Gmail"><i class="bi bi-google" aria-hidden="true"></i></a>
          <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" aria-label="Facebook" title="Facebook"><i class="bi bi-facebook" aria-hidden="true"></i></a>
          <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram"><i class="bi bi-instagram" aria-hidden="true"></i></a>
          <a href="#scan" id="scan-link" aria-label="Scan QR code" title="Scan QR code"><i class="bi bi-qr-code-scan" aria-hidden="true"></i></a>
        </nav>
      </div>
    </section>
    <section class="visual-panel" aria-label="Dileonastreet background image"></section>
  </main>
  <script>
    (() => {
      const form = document.querySelector('#auth-form');
      const title = document.querySelector('#form-title');
      const intro = document.querySelector('#form-intro');
      const nameField = document.querySelector('#name-field');
      const confirmField = document.querySelector('#confirm-field');
      const nameInput = document.querySelector('#full-name');
      const confirmInput = document.querySelector('#confirm-password');
      const passwordInput = document.querySelector('#password');
      const loginOptions = document.querySelector('#login-options');
      const submitButton = document.querySelector('#submit-btn');
      const switchPrompt = document.querySelector('#switch-prompt');
      const switchLink = document.querySelector('#switch-link');
      const message = document.querySelector('#flash-message');
      const forgotLink = document.querySelector('#forgot-link');
      const scanLink = document.querySelector('#scan-link');
      let isSignUp = false;

      function setMode(signUp) {
        isSignUp = signUp;
        nameField.hidden = !signUp;
        confirmField.hidden = !signUp;
        nameInput.required = signUp;
        confirmInput.required = signUp;
        loginOptions.hidden = signUp;
        passwordInput.autocomplete = signUp ? 'new-password' : 'current-password';
        title.textContent = signUp ? 'CREATE ACCOUNT' : 'WELCOME BACK';
        intro.textContent = signUp ? 'Create your account to join DILEONASTREET.' : 'Sign in to your account to continue.';
        submitButton.textContent = signUp ? 'Create Account' : 'Access Account';
        switchPrompt.textContent = signUp ? 'Already have an account?' : "Don't have an account?";
        switchLink.textContent = signUp ? 'Log in' : 'Sign up';
        switchLink.href = signUp ? '#login' : '#signup';
        message.textContent = '';
      }

      switchLink.addEventListener('click', (event) => {
        event.preventDefault();
        setMode(!isSignUp);
      });

      document.querySelectorAll('.password-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          const input = button.parentElement.querySelector('input');
          const show = input.type === 'password';
          input.type = show ? 'text' : 'password';
          button.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          button.title = show ? 'Hide password' : 'Show password';
          button.innerHTML = `<i class="bi ${show ? 'bi-eye-slash' : 'bi-eye'}" aria-hidden="true"></i>`;
        });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (isSignUp && passwordInput.value !== confirmInput.value) {
          confirmInput.setCustomValidity('Passwords do not match.');
          confirmInput.reportValidity();
          confirmInput.setCustomValidity('');
          return;
        }
        message.textContent = isSignUp
          ? 'Account details are valid. Connect this form to your authentication service to create the account.'
          : 'Sign-in details are valid. Connect this form to your authentication service to continue.';
      });

      forgotLink.addEventListener('click', (event) => {
        event.preventDefault();
        message.textContent = 'Password recovery needs to be connected to your authentication service.';
      });

      scanLink.addEventListener('click', (event) => {
        event.preventDefault();
        message.textContent = 'Connect this QR button to your QR scanner or sign-in link.';
      });
    })();
  </script>
</body>
</html>
